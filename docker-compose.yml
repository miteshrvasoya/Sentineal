# Docker runs ONLY the database. The backend and frontend run locally (make dev) and connect to it.
#   make db-up      start PostgreSQL (data persists in the quantlens-pgdata volume)
#   make db-down    stop it (data is kept)      make db-reset   stop it and DELETE the data
# The port is bound to localhost only. The default password is for local development; override with POSTGRES_PASSWORD.
services:
  db:
    image: postgres:16-alpine
    container_name: quantlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantlens}
      POSTGRES_DB: quantlens
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["quantlens-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlens -d quantlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quantlens-pgdata:
