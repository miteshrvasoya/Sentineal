[project]
name = "quantlens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "yfinance>=0.2.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tzdata",
  "pyotp>=2.12.1",
  "scipy>=1.17.1",
  "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B024", "E501", "E741"]
