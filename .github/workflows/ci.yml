name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd backend && uv sync && uv run ruff check . && uv run pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: quantlens, POSTGRES_PASSWORD: quantlens, POSTGRES_DB: quantlens }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantlens" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd backend && uv sync && uv run pytest tests/test_postgres.py -q
        env: { TEST_PG_URL: "postgresql+psycopg://quantlens:quantlens@127.0.0.1:5432/quantlens" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npx tsc --noEmit && npm run build
